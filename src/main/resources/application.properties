spring.application.name=spacemap

# JWT
app.security.jwt.secret=${JWT_SECRET:change-me-to-a-very-long-secret-key-32b}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/spacemap}
spring.datasource.username=${DATABASE_USER:spacemap}
spring.datasource.password=${DATABASE_PASSWORD:spacemap}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Object storage (MinIO / S3-compatible)
app.storage.endpoint=${STORAGE_ENDPOINT:http://localhost:9000}
app.storage.access-key=${STORAGE_ACCESS_KEY:minioadmin}
app.storage.secret-key=${STORAGE_SECRET_KEY:minioadmin}
app.storage.bucket=${STORAGE_BUCKET:spacemap}
app.storage.region=${STORAGE_REGION:us-east-1}
app.storage.max-file-size-bytes=${STORAGE_MAX_FILE_SIZE:20971520}

# Multipart limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
